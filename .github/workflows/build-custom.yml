name: Build custom Codeg

on:
  push:
    branches: [release/custom]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

concurrency:
  group: custom-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=4096
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  web:
    name: Build Web frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build static export
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: out/
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: Server and Desktop ${{ matrix.platform }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            suffix: .exe
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps: &build_steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build server and stage desktop sidecars
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node src-tauri/scripts/prepare-sidecars.mjs --target "$TARGET" --with-server

      - uses: actions/download-artifact@v4
        with:
          name: web-static
          path: out

      - name: Package Server
        id: server_package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          release_dir="src-tauri/target/${TARGET}/release"
          mkdir -p dist
          cp "${release_dir}/codeg-server${SUFFIX}" dist/
          for binary in codeg-mcp codeg-computer-helper codeg-cli; do
            cp "${release_dir}/${binary}${SUFFIX}" dist/
          done
          cp -R out dist/web
          test -f dist/web/index.html
          version="$(./dist/codeg-server${SUFFIX} --version)"
          ./dist/codeg-mcp${SUFFIX} --help
          name="codeg-server-${version}-custom-${SOURCE_SHA:0:8}-${PLATFORM}"
          path=dist/
          if [[ "$PLATFORM" != windows-x64 ]]; then
            path="${name}.tar.gz"
            tar -czf "$path" -C dist .
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.server_package.outputs.name }}
          path: ${{ steps.server_package.outputs.path }}
          if-no-files-found: error

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then export CARGO_BUILD_JOBS=2; fi
          if [[ "$RUNNER_OS" == macOS ]]; then export APPLE_SIGNING_IDENTITY=-; fi
          pnpm tauri build --target "$TARGET" --bundles "$BUNDLES" \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

      - name: Name desktop artifact
        id: desktop_package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "name=codeg-desktop-${version}-custom-${SOURCE_SHA:0:8}-${PLATFORM}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desktop_package.outputs.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build_linux:
    name: Server and Desktop ${{ matrix.platform }}
    needs: web
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux-x64
            suffix: ""
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    steps: *build_steps

  build_macos_arm64:
    name: Server and Desktop ${{ matrix.platform }}
    needs: web
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
            suffix: ""
            target: aarch64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    steps: *build_steps

  build_macos_intel:
    name: Server and Desktop ${{ matrix.platform }}
    needs: web
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
            suffix: ""
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    steps: *build_steps

  publish_windows:
    name: Publish Windows packages
    needs: build_windows
    env:
      PLATFORM: windows-x64
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps: &publish_steps
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: codeg-*-${{ env.PLATFORM }}
          path: artifacts

      - name: Sign and publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CODEG_CUSTOM_SIGNING_KEY }}
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="custom-${version}-${SOURCE_SHA:0:8}"
          build_id="${version}-custom-${SOURCE_SHA:0:8}"
          shopt -s nullglob globstar

          release_status="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          server="codeg-server-${build_id}-${PLATFORM}"
          desktop_dir="artifacts/codeg-desktop-${build_id}-${PLATFORM}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          if [[ "$PLATFORM" == windows-x64 ]]; then
            if [[ "$release_status" == false ]]; then exit 0; fi
            desktop=("$desktop_dir"/**/*.exe)
            keys=(windows-x86_64)
            test "${#desktop[@]}" -eq 1
            test -f "artifacts/$server/codeg-server.exe"
            archive=codeg-server-windows-x64.zip
            (cd "artifacts/$server" && zip -qr "../../$archive" .)
            jq -n --arg version "$version" '{version: $version, platforms: {}}' > latest.json
          elif [[ "$PLATFORM" == linux-x64 ]]; then
            test "$release_status" = false
            deb=("$desktop_dir"/**/*.deb)
            rpm=("$desktop_dir"/**/*.rpm)
            test "${#deb[@]}" -eq 1
            test "${#rpm[@]}" -eq 1
            desktop=("${deb[0]}" "${rpm[0]}")
            keys=(linux-x86_64-deb linux-x86_64-rpm)
            archive=codeg-server-linux-x64.tar.gz
            cp "artifacts/$server/$server.tar.gz" "$archive"
            gh release download "$tag" --pattern latest.json
            jq -e --arg version "$version" '.version == $version and (.platforms["windows-x86_64"] != null)' latest.json >/dev/null
          else
            test "$release_status" = false
            dmg=("$desktop_dir"/**/*.dmg)
            test "${#dmg[@]}" -eq 1
            desktop=("codeg_${version}_${PLATFORM}.dmg")
            cp "${dmg[0]}" "${desktop[0]}"
            archive="codeg-server-${PLATFORM}.tar.gz"
            cp "artifacts/$server/$server.tar.gz" "$archive"
          fi

          assets=("$archive" "${desktop[@]}")
          for asset in "${assets[@]}"; do
            pnpm tauri signer sign --app-version "$version" "$asset"
          done
          if [[ "$PLATFORM" == darwin-* ]]; then
            gh release upload "$tag" --clobber "${assets[@]}" "${assets[@]/%/.sig}"
            exit 0
          fi
          for i in "${!desktop[@]}"; do
            asset="${desktop[$i]}"
            jq --arg key "${keys[$i]}" --arg url "$base/$(basename "$asset")" \
              --rawfile sig "$asset.sig" \
              '.platforms[$key] = {url: $url, signature: ($sig | rtrimstr("\n"))}' \
              latest.json > next.json
            mv next.json latest.json
          done

          if [[ -z "$release_status" ]]; then
            previous_tag="$(git describe --first-parent --tags --match 'custom-*' --exclude "$tag" --abbrev=0 "$SOURCE_SHA" 2>/dev/null || true)"
            {
              printf '%s\n' 'Windows x64 desktop and server packages are published first. Linux x64 and macOS packages are added after their builds succeed.'
              if [[ -n "$previous_tag" ]]; then
                printf '\n## Changes since %s\n\n' "$previous_tag"
                git log --first-parent --format='- %s (%h)' "${previous_tag}..${SOURCE_SHA}"
                printf '\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$previous_tag" "$tag"
              fi
            } > release-notes.md
            gh release create "$tag" --target "$SOURCE_SHA" --title "Codeg custom ${build_id}" \
              --notes-file release-notes.md \
              --draft
          elif [[ "$PLATFORM" == windows-x64 ]]; then
            gh release view "$tag" --json body --jq .body > release-notes.md
          fi
          # The updater dialog shows the manifest's `notes`; the Linux pass
          # re-reads this file, so injecting once here covers both platforms.
          if [[ -f release-notes.md ]]; then
            jq --rawfile notes release-notes.md \
              '. + {notes: ($notes | rtrimstr("\n"))}' latest.json > next.json
            mv next.json latest.json
          fi
          gh release upload "$tag" --clobber "${assets[@]}" "${assets[@]/%/.sig}" latest.json
          if [[ "$PLATFORM" == windows-x64 ]]; then
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi

  publish_linux:
    name: Add Linux packages
    needs: [build_linux, publish_windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      PLATFORM: linux-x64
    steps: *publish_steps

  publish_macos_arm64:
    name: Add macOS Apple silicon packages
    needs: [build_macos_arm64, publish_windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      PLATFORM: darwin-arm64
    steps: *publish_steps

  publish_macos_intel:
    name: Add macOS Intel packages
    needs: [build_macos_intel, publish_windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      PLATFORM: darwin-x64
    steps: *publish_steps
