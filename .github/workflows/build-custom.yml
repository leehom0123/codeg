name: Build custom Codeg

on:
  push:
    branches: [release/custom]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

concurrency:
  group: custom-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_OPTIONS: --max-old-space-size=4096
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}

jobs:
  web:
    name: Build Web frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build static export
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: out/
          if-no-files-found: error
          retention-days: 7

  build:
    name: Server and Desktop ${{ matrix.platform }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            suffix: .exe
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-22.04
            platform: linux-x64
            suffix: ""
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Server binaries
        shell: bash
        working-directory: src-tauri
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --release --target "$TARGET" --no-default-features --features server-bin,mcp-bin,computer-helper,cli-bin \
            --bin codeg-server --bin codeg-mcp --bin codeg-computer-helper --bin codeg-cli

      - uses: actions/download-artifact@v4
        with:
          name: web-static
          path: out

      - name: Package Server
        id: server_package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          release_dir="src-tauri/target/${TARGET}/release"
          mkdir -p dist src-tauri/binaries
          cp "${release_dir}/codeg-server${SUFFIX}" dist/
          for binary in codeg-mcp codeg-computer-helper codeg-cli; do
            cp "${release_dir}/${binary}${SUFFIX}" dist/
            cp "${release_dir}/${binary}${SUFFIX}" "src-tauri/binaries/${binary}-${TARGET}${SUFFIX}"
          done
          cp -R out dist/web
          test -f dist/web/index.html
          version="$(./dist/codeg-server${SUFFIX} --version)"
          ./dist/codeg-mcp${SUFFIX} --help
          name="codeg-server-${version}-custom-${SOURCE_SHA:0:8}-${PLATFORM}"
          path=dist/
          if [[ "$PLATFORM" == linux-x64 ]]; then
            path="${name}.tar.gz"
            tar -czf "$path" -C dist .
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.server_package.outputs.name }}
          path: ${{ steps.server_package.outputs.path }}
          if-no-files-found: error

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          pnpm tauri build --target "$TARGET" --bundles "$BUNDLES" \
            --config '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'

      - name: Name desktop artifact
        id: desktop_package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "name=codeg-desktop-${version}-custom-${SOURCE_SHA:0:8}-${PLATFORM}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.desktop_package.outputs.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish:
    name: Publish custom release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: codeg-*
          path: artifacts

      - name: Publish Windows and Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CODEG_CUSTOM_SIGNING_KEY }}
        shell: bash
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="custom-${version}-${SOURCE_SHA:0:8}"
          build_id="${version}-custom-${SOURCE_SHA:0:8}"
          shopt -s nullglob globstar

          windows_server="codeg-server-${build_id}-windows-x64"
          linux_server="codeg-server-${build_id}-linux-x64"
          windows_desktop=(artifacts/codeg-desktop-"${build_id}"-windows-x64/**/*.exe)
          linux_deb=(artifacts/codeg-desktop-"${build_id}"-linux-x64/**/*.deb)
          linux_rpm=(artifacts/codeg-desktop-"${build_id}"-linux-x64/**/*.rpm)
          test -f "artifacts/${windows_server}/codeg-server.exe"
          test -f "artifacts/${linux_server}/${linux_server}.tar.gz"
          test "${#windows_desktop[@]}" -eq 1
          test "${#linux_deb[@]}" -eq 1
          test "${#linux_rpm[@]}" -eq 1

          release_status="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$release_status" == false ]]; then
            exit 0
          fi

          (cd "artifacts/${windows_server}" && zip -qr ../../codeg-server-windows-x64.zip .)
          cp "artifacts/${linux_server}/${linux_server}.tar.gz" codeg-server-linux-x64.tar.gz
          assets=(codeg-server-windows-x64.zip codeg-server-linux-x64.tar.gz
            "${windows_desktop[@]}" "${linux_deb[@]}" "${linux_rpm[@]}")
          for asset in "${assets[@]}"; do
            pnpm tauri signer sign --app-version "$version" "$asset"
          done
          jq -n --arg version "$version" \
            --arg base "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag" \
            --arg win "$(basename "${windows_desktop[0]}")" \
            --arg deb "$(basename "${linux_deb[0]}")" \
            --arg rpm "$(basename "${linux_rpm[0]}")" \
            --rawfile win_sig "${windows_desktop[0]}.sig" \
            --rawfile deb_sig "${linux_deb[0]}.sig" \
            --rawfile rpm_sig "${linux_rpm[0]}.sig" '
            {version: $version, platforms: {
              "windows-x86_64": {url: ($base + "/" + $win), signature: ($win_sig | rtrimstr("\n"))},
              "linux-x86_64-deb": {url: ($base + "/" + $deb), signature: ($deb_sig | rtrimstr("\n"))},
              "linux-x86_64-rpm": {url: ($base + "/" + $rpm), signature: ($rpm_sig | rtrimstr("\n"))}
            }}' > latest.json

          if [[ -z "$release_status" ]]; then
            previous_tag="$(git describe --first-parent --tags --match 'custom-*' --exclude "$tag" --abbrev=0 "$SOURCE_SHA" 2>/dev/null || true)"
            {
              printf '%s\n' 'Includes desktop and Server packages for Windows x64 and Linux x64.'
              if [[ -n "$previous_tag" ]]; then
                printf '\n## Changes since %s\n\n' "$previous_tag"
                git log --first-parent --format='- %s (%h)' "${previous_tag}..${SOURCE_SHA}"
                printf '\n[Full changelog](https://github.com/%s/compare/%s...%s)\n' "$GITHUB_REPOSITORY" "$previous_tag" "$tag"
              fi
            } > release-notes.md
            gh release create "$tag" --target "$SOURCE_SHA" --title "Codeg custom ${build_id}" \
              --notes-file release-notes.md \
              --draft
          fi
          gh release upload "$tag" --clobber "${assets[@]}" "${assets[@]/%/.sig}" latest.json
          gh release edit "$tag" --draft=false --prerelease=false --latest
