name: Sync upstream main

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'leehom0123/codeg' && github.ref == 'refs/heads/release/custom'
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.merge.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/custom
          fetch-depth: 0
      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          # Follow upstream main as it moves, not only when upstream cuts a
          # release: each tick brings custom up to whatever main holds, so
          # custom builds always sit on the newest upstream code (the trade —
          # a build can land on an unreleased middle point — is accepted).
          upstream=spacering-net/codeg
          git fetch --no-tags "https://github.com/$upstream.git" \
            refs/heads/main:refs/remotes/upstream/main
          git fetch origin refs/heads/main:refs/remotes/origin/main
          # The fork-main push below only fast-forwards while our main sits
          # inside upstream's history; a divergence must fail loudly here.
          git merge-base --is-ancestor origin/main upstream/main
          git push origin refs/remotes/upstream/main:refs/heads/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream main is already included."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff -m "Merge upstream main" upstream/main
          git push origin HEAD:refs/heads/release/custom
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: sync
    if: needs.sync.outputs.source_sha != ''
    uses: ./.github/workflows/build-custom.yml
    with:
      source_sha: ${{ needs.sync.outputs.source_sha }}
    secrets: inherit
